name: CI-PROD

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
      - '!*alpha*'
      - '!*beta*'
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4 # <-- Aggiornato

      # QEMU per build multi-piattaforma
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3 # <-- Aggiornato

      # Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # <-- Aggiornato

      # Meta
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5 # <-- Aggiornato
        with:
          images: |
            ${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            type=sha
            type=pep440,pattern={{version}}
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            maintainer=${{ github.actor }} # <-- Corretto
            org.opencontainers.image.description=Thanos Bot!
            org.opencontainers.image.vendor=AlbyCorp

      # Dockerhub Login
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' # <-- Aggiunto per non eseguire il login su PR
        uses: docker/login-action@v3 # <-- Aggiornato
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Build e Push su Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v5 # <-- Aggiornato
        with:
          context: ./
          file: ./Thanos/Dockerfile
          push: ${{ github.event_name != 'pull_request' }} # <-- Esegue il push solo se non è una PR
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_CONFIGURATION=Release